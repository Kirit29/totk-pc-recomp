name: Windows setup

# Builds TotK-Setup.zip (tools/make_release.py) on a Windows runner, without game files: tools/ci_layout_stub.py writes
# the module layout the runtime library needs in place of a lifted game. The zip is the run's artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Python environments
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/Scripts/python.exe -r tools/requirements.txt
          uv venv --python 3.14 .venv-py314
          uv pip install --python .venv-py314/Scripts/python.exe -r tools/requirements-py314.txt

      - name: MSYS2 gcc and make for hactool
        run: |
          if (-not (Test-Path C:\msys64\usr\bin\bash.exe)) { throw "C:\msys64 is missing on this runner image" }
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make make"

      # make_release.py ends with the setup's own host check, which needs a Vulkan 1.3 device. The runner has no GPU:
      # Mesa's software driver (lavapipe) stands in, installed the way a GPU driver is (the loader in System32, the
      # driver in the Khronos registry key), because the check runs with a cleaned environment and PATH.
      - name: Software Vulkan driver
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --needed --noconfirm mingw-w64-ucrt-x86_64-mesa mingw-w64-ucrt-x86_64-vulkan-loader"
          if ($LASTEXITCODE) { throw "pacman failed" }
          $bin = "C:\msys64\ucrt64\bin"
          $loader = Get-ChildItem $bin -Filter "*vulkan-1.dll" | Select-Object -First 1
          if (-not $loader) { throw "no Vulkan loader in $bin" }
          Copy-Item $loader.FullName C:\Windows\System32\vulkan-1.dll -Force
          $icd = Get-ChildItem C:\msys64\ucrt64 -Recurse -Filter "lvp_icd*.json" | Select-Object -First 1
          if (-not $icd) { throw "no lavapipe ICD manifest under C:\msys64\ucrt64" }
          Get-Content $icd.FullName
          $key = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name $icd.FullName -Value 0 -PropertyType DWord -Force | Out-Null
          Write-Host "loader $($loader.FullName) -> System32; driver $($icd.FullName)"

      - name: Upstream references
        shell: bash
        run: sh tools/fetch_refs.sh

      - name: Module layout without the game
        run: .venv/Scripts/python tools/ci_layout_stub.py --version v121

      - name: hactool
        run: .venv/Scripts/python tools/build_hactool.py

      - name: Shader translator
        run: .venv/Scripts/python tools/build_xlate.py

      - uses: actions/cache@v4
        with:
          path: toolchain/release-dl
          key: release-dl-${{ hashFiles('tools/make_release.py', 'tools/requirements-installer.txt') }}

      - name: Release
        run: .venv-py314/Scripts/python tools/make_release.py --out build/release/TotK-Setup --zip build/release/TotK-Setup.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup-windows
          path: build/release/TotK-Setup.zip
          compression-level: 0
          retention-days: 30
